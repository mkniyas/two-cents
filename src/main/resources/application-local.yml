server:
  port: 8080
spring:
  application:
    name: cpe
  profiles:
    active: local
  data:
    mongodb:
      uri: mongodb://root:secret@localhost:27017
      database: cpe
      ssl:
        enabled: false
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: cpe-group
      auto-offset-reset: earliest
logging:
  structured:
    level:
      root: debug
      com.patientpoint: debug
