openapi: 3.0.3
info:
  title: poc-service:1.0.0 API
  description: Spring Boot microservice for PatientPoint platform.
  version: 1.0.0
  contact:
    name: PatientPoint
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /hello:
    get:
      summary: Hello World endpoint
      description: Returns a greeting message
      operationId: hello
      tags:
        - Hello
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
components:
  schemas:
    HelloResponse:
      type: object
      properties:
        message:
          type: string
          example: "Hello, World!"
      required:
        - message

