name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - '*'

env:
  APP_NAME: {{imageName}}

jobs:
  spotlesscheck-and-unit-tests-and-build:
    name: Spotless Check & Unit Tests & Build
    runs-on: ubuntu-latest
    env:
      ARTIFACTORY_USER: '${{ secrets.ARTIFACTORY_USER }}' 
      ARTIFACTORY_PASS: '${{ secrets.ARTIFACTORY_PASSWORD }}'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        [cite_start]uses: actions/setup-java@v4 [cite: 7]
        with:
          distribution: temurin
          java-version: 21

      - [cite_start]uses: gradle/actions/setup-gradle@v4 [cite: 10]

      - name: Spotless Check
        run: ./gradlew --no-daemon spotlessCheck

      - name: Unit Tests
        run: ./gradlew --no-daemon test

      - name: Build
        [cite_start]run: ./gradlew --no-daemon clean build -x test -x spotlessCheck [cite: 8]

      - name: Upload built JAR artifact
        uses: actions/upload-artifact@v4
        with:
          [cite_start]name: {{imageName}}-jar [cite: 12]
          path: build/libs/*.jar
          if-no-files-found: error

  sonar-analysis:
    name: SonarQube Analysis & Quality Gate
    runs-on: ppht-runner-set
    needs: spotlesscheck-and-unit-tests-and-build
    env:
      # FIX: Changing to single quotes around the GitHub expression
      [cite_start]ARTIFACTORY_USER: '${{ secrets.ARTIFACTORY_USER }}' [cite: 9]
      ARTIFACTORY_PASS: '${{ secrets.ARTIFACTORY_PASSWORD }}'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: SonarQube Analysis (Gradle)
        run: ./gradlew --no-daemon sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
        env:
          SONAR_HOST_URL: https://sonarqube.shared.patientpoint.io
          # FIX: Changing to single quotes around the GitHub expression
          SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}'

      - name: Verify Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          scanMetadataReportFile: build/sonar/report-task.txt
          [cite_start]pollingTimeoutSec: 600 [cite: 11]
        env:
          # FIX: Changing to single quotes around the GitHub expression
          SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}'
          SONAR_HOST_URL: https://sonarqube.shared.patientpoint.io

  prepare-docker-context:
    name: Prepare Docker Build Context
    needs: sonar-analysis
    runs-on: ubuntu-latest
    outputs:
      ready: true
    steps:
      - uses: actions/checkout@v5

      - [cite_start]name: Download built JAR artifact [cite: 12]
        uses: actions/download-artifact@v4
        with:
          name: {{imageName}}-jar
          path: build/libs

      - name: Verify artifact
        run: |
          [cite_start]echo "JARs available before Docker build:" [cite: 13]
          ls -l build/libs

      - name: Re-upload JAR for Docker build
        uses: actions/upload-artifact@v4
        with:
          name: {{imageName}}-docker-jar
          path: build/libs/*.jar
          if-no-files-found: error

  setup:
    uses: contextmedia/gh-actions/.github/workflows/setup.yml@main
    needs: prepare-docker-context
    with:
      [cite_start]appName: {{imageName}} [cite: 14]

  docker-build:
    name: Docker Build & Push Image
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: {{imageName}}-jar
          path: build/libs

      - name: Verify JAR
        [cite_start]run: ls -lh build/libs [cite: 15]

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # FIX: Changing to single quotes around the GitHub expression
          images: '${{ needs.setup.outputs.image }}'
          tags: |
            [cite_start]type=raw,value='${{ needs.setup.outputs.build_id }}' [cite: 16]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Artifactory
        uses: docker/login-action@v3
        with:
          registry: outcomehealth-oh-docker-local.jfrog.io
          # FIX: Changing to single quotes around the GitHub expression
          username: '${{ secrets.ARTIFACTORY_USER }}'
          password: '${{ secrets.ARTIFACTORY_PASSWORD }}'

      - name: Build & push image
        [cite_start]uses: docker/build-push-action@v6 [cite: 17]
        with:
          context: .
          [cite_start]push: true [cite: 18]
          # FIX: Changing to single quotes around the GitHub expression
          tags: '${{ steps.meta.outputs.tags }}'

  deploy:
    name: Deploy
    needs: docker-build
    uses: contextmedia/gh-actions/.github/workflows/eks-deploy.yml@main
    with:
      appName: {{imageName}}
    secrets: inherit

  notify_slack:
    name: Slack Alert
    runs-on: ubuntu-latest
    needs:
      - spotlesscheck-and-unit-tests-and-build
      - [cite_start]sonar-analysis [cite: 20]
      - docker-build
      - [cite_start]deploy [cite: 21]
    if: always()
    [cite_start]steps: [cite: 19]
      - name: Post failure to Slack
        if: >
          needs.spotlesscheck-and-unit-tests-and-build.result != 'success' ||
          needs.sonar-analysis.result != 'success' ||
          needs.docker-build.result != 'success' ||
          needs.deploy.result != 'success'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          # FIX: Changing to single quotes around the GitHub expression
          webhook: '${{ secrets.SLACK_WEBHOOK_URL }}'
          webhook-type: incoming-webhook
          payload: |
            [cite_start]text: "❌ '${{ env.APP_NAME }}'* '${{ github.workflow }}' failed on '${{ github.ref_name }}' (#'${{ github.run_number }}')" [cite: 21]
            attachments:
              - color: "danger"
                text: "❌ *${{ env.APP_NAME }}* '${{ github.workflow }}' run <'${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}> failed"
            blocks:
              - [cite_start]type: section [cite: 22]
                text:
                  type: mrkdwn
                  text: "❌ *${{ env.APP_NAME }}* *'${{ github.workflow }}'* run <'${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}> *failed* on *'${{ github.ref_name }}'*"
              - [cite_start]type: section [cite: 23]
                fields:
                  - type: mrkdwn
                    text: "*Commit:* <'${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}'|'${{ github.sha }}'>"
                  - type: mrkdwn
                    [cite_start]text: "*By:* '${{ github.actor }}'" [cite: 25]

      - name: Post success to Slack
        if: >
          needs.spotlesscheck-and-unit-tests-and-build.result == 'success' &&
          needs.sonar-analysis.result == 'success' &&
          needs.docker-build.result == 'success' &&
          needs.deploy.result == 'success'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          [cite_start]webhook: '${{ secrets.SLACK_WEBHOOK_URL }}' [cite: 25]
          webhook-type: incoming-webhook
          payload: |
            [cite_start]text: "✅ *${{ env.APP_NAME }}* '${{ github.workflow }}' succeeded on '${{ github.ref_name }}' (#'${{ github.run_number }}')" [cite: 26]
            attachments:
              - color: "good"
                text: "✅ *${{ env.APP_NAME }}* '${{ github.workflow }}' run <'${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}> succeeded"
            blocks:
              - [cite_start]type: section [cite: 27]
                text:
                  type: mrkdwn
                  text: "✅ *${{ env.APP_NAME }}* *'${{ github.workflow }}'* run <'${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}> *succeeded* on *'${{ github.ref_name }}'*"
              - [cite_start]type: section [cite: 28]
                fields:
                  - type: mrkdwn
                    text: "*Commit:* <'${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}'|'${{ github.sha }}'>"
                  - type: mrkdwn
                    [cite_start]text: "*By:* '${{ github.actor }}'" [cite: 29]
