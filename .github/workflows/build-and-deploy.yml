name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - '*'

env:
  APP_NAME: poc-service:1.0.0

jobs:
  spotlesscheck-and-unit-tests-and-build:
    name: Spotless Check & Unit Tests & Build
    runs-on: ubuntu-latest
    env:
      ARTIFACTORY_USER: $
      ARTIFACTORY_PASS: $
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Spotless Check
        run: ./gradlew --no-daemon spotlessCheck

      - name: Unit Tests
        run: ./gradlew --no-daemon test

      - name: Build
        run: ./gradlew --no-daemon clean build -x test -x spotlessCheck

      - name: Upload built JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: poc-service:1.0.0-jar
          path: build/libs/*.jar
          if-no-files-found: error

  sonar-analysis:
    name: SonarQube Analysis & Quality Gate
    runs-on: ppht-runner-set
    needs: spotlesscheck-and-unit-tests-and-build
    env:
      ARTIFACTORY_USER: $
      ARTIFACTORY_PASS: $
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: SonarQube Analysis (Gradle)
        run: ./gradlew --no-daemon sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
        env:
          SONAR_HOST_URL: https://sonarqube.shared.patientpoint.io
          SONAR_TOKEN: $

      - name: Verify Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          scanMetadataReportFile: build/sonar/report-task.txt
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: $
          SONAR_HOST_URL: https://sonarqube.shared.patientpoint.io

  prepare-docker-context:
    name: Prepare Docker Build Context
    needs: sonar-analysis
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    outputs:
      ready: true
    steps:
      - uses: actions/checkout@v5

      - name: Download built JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: poc-service:1.0.0-jar
          path: build/libs

      - name: Verify artifact
        run: |
          echo "JARs available before Docker build:"
          ls -l build/libs

      - name: Re-upload JAR for Docker build
        uses: actions/upload-artifact@v4
        with:
          name: poc-service:1.0.0-docker-jar
          path: build/libs/*.jar
          if-no-files-found: error

  setup:
    uses: contextmedia/gh-actions/.github/workflows/setup.yml@main
    needs: prepare-docker-context
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    with:
      appName: poc-service:1.0.0

  docker-build:
    name: Docker Build & Push Image
    needs: setup
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: poc-service:1.0.0-jar
          path: build/libs

      - name: Verify JAR
        run: ls -lh build/libs

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: $
          tags: |
            type=raw,value=$

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Artifactory
        uses: docker/login-action@v3
        with:
          registry: outcomehealth-oh-docker-local.jfrog.io
          username: $
          password: $

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: $

  deploy:
    name: Deploy
    needs: docker-build
    uses: contextmedia/gh-actions/.github/workflows/eks-deploy.yml@main
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    with:
      appName: poc-service:1.0.0
    secrets: inherit

  notify_slack:
    name: Slack Alert
    runs-on: ubuntu-latest
    needs: [spotlesscheck-and-unit-tests-and-build, sonar-analysis, docker-build, deploy]
    if: always()
    steps:
      - name: Post failure to Slack
        if: >
          needs.spotlesscheck-and-unit-tests-and-build.result != 'success' ||
          needs.sonar-analysis.result != 'success' ||
          needs.docker-build.result != 'success' ||
          needs.deploy.result != 'success'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: $
          webhook-type: incoming-webhook
          payload: |
            text: "❌ *$* $ failed on $ (#$)"
            attachments:
              - color: "danger"
                text: "❌ *$* $ run <$/$/actions/runs/$|#$> failed"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "❌ *$* *$* run <$/$/actions/runs/$|#$> *failed* on *$*"
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*Commit:* <$/$/commit/$|$>"
                  - type: mrkdwn
                    text: "*By:* $"

      - name: Post success to Slack
        if: >
          needs.spotlesscheck-and-unit-tests-and-build.result == 'success' &&
          needs.sonar-analysis.result == 'success' &&
          needs.docker-build.result == 'success' &&
          needs.deploy.result == 'success'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: $
          webhook-type: incoming-webhook
          payload: |
            text: "✅ *$* $ succeeded on $ (#$)"
            attachments:
              - color: "good"
                text: "✅ *$* $ run <$/$/actions/runs/$|#$> succeeded"
            blocks:
            - type: section
              text:
                type: mrkdwn
                text: "✅ *$* *$* run <$/$/actions/runs/$|#$> *succeeded* on *$*"
            - type: section
              fields:
                - type: mrkdwn
                  text: "*Commit:* <$/$/commit/$|$>"
                - type: mrkdwn
                  text: "*By:* $"

